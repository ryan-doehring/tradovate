name: EOD Flat

on:
  schedule:
    # Once daily before CME equity close (weekdays, CT). Calendar picks regular vs early close.
    - cron: "52 14 * * 1-5"
      timezone: America/Chicago
  workflow_dispatch:
    inputs:
      environment:
        description: GitHub Environment (demo or live)
        required: true
        default: demo
        type: choice
        options:
          - demo
          - live

jobs:
  eod-flat:
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'demo' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install .

      - name: Run EOD flat (positions only)
        env:
          TRADING_MODE: ${{ vars.TRADING_MODE || 'dry_run' }}
          TRADOVATE_USERNAME: ${{ secrets.TRADOVATE_USERNAME }}
          TRADOVATE_PASSWORD: ${{ secrets.TRADOVATE_PASSWORD }}
          TRADOVATE_APP_ID: ${{ secrets.TRADOVATE_APP_ID }}
          TRADOVATE_CID: ${{ secrets.TRADOVATE_CID }}
          TRADOVATE_SEC: ${{ secrets.TRADOVATE_SEC }}
          TRADOVATE_API_URL: ${{ secrets.TRADOVATE_API_URL }}
          EOD_MINUTES_BEFORE_CLOSE: ${{ vars.EOD_MINUTES_BEFORE_CLOSE || '5' }}
          TIMEZONE: America/Chicago
        run: tradovate-bot eod-flat --artifact-dir artifacts

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eod-flat-report
          path: artifacts/
