[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tradovate-bot"
version = "0.1.0"
description = "Sync Google Sheet trades to Tradovate with news and EOD guards"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Ryan Doehring" }]
dependencies = [
    "beautifulsoup4>=4.12",
    "google-api-python-client>=2.100",
    "google-auth>=2.23",
    "httpx>=0.27",
    "lxml>=5.0",
    "pandas-market-calendars>=4.4",
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
    "python-dateutil>=2.8",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = [
    "openpyxl>=3.1",
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "ruff>=0.4",
]

[project.scripts]
tradovate-bot = "tradovate_bot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
